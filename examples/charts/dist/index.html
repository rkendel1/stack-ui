/* Fills its column even when a product centres <main> with auto margins,
   which would otherwise size it to its content and overflow narrow screens. */
.stack-shell__main { box-sizing: border-box; width: 100%; min-width: 0; padding: var(--stack-space-6); }
.stack-shell__main:focus { outline: none; }
/* Only shown in menu mode on narrow screens (below). */
.stack-shell__menu-button {
  display: none; align-items: center; justify-content: center; min-width: 44px; min-height: 44px; margin: 0;
  padding: 0; border: 0; border-radius: var(--stack-radius-md); background: transparent; color: var(--stack-color-text-default);
  font: inherit; font-size: var(--stack-text-lg-size); cursor: pointer;
}

  .stack-shell__nav {
    display: flex; gap: var(--stack-space-3); padding: var(--stack-space-2) var(--stack-space-3);
    border-right: 0; border-bottom: var(--stack-border-width-thin) solid var(--stack-color-border-default); overflow-x: auto;
  }

  .stack-shell__nav-list { display: flex; gap: var(--stack-space-1); }
  .stack-shell__nav-item { white-space: nowrap; }
  .stack-shell__main { padding: var(--stack-space-4); }

  .stack-shell--menu.stack-shell--menu-open .stack-shell__nav {
    display: block; padding: var(--stack-space-3); overflow-x: visible; overflow-y: auto;
  }
  .stack-shell--menu.stack-shell--menu-open .stack-shell__nav-group + .stack-shell__nav-group { margin-top: var(--stack-space-4); }
  .stack-shell--menu.stack-shell--menu-open .stack-shell__nav-heading { display: block; }
  .stack-shell--menu.stack-shell--menu-open .stack-shell__nav-list { display: block; }
  .stack-shell--menu.stack-shell--menu-open .stack-shell__nav-item { white-space: normal; }
}

/* Focus rings for the new interactive parts. */
.stack-tabs__tab:focus-visible, .stack-table__sort:focus-visible, .stack-table:focus-visible,
.stack-table__row--selectable:focus-visible, .stack-filter__control:focus-visible, .stack-shell__theme:focus-visible,
.stack-shell__nav-item:focus-visible, .stack-shell__product:focus-visible, .stack-breadcrumbs__link:focus-visible,

/* ---- Fields, forms and dialogs (PR4) ----------------------------------- */

.stack-dialog {
  box-sizing: border-box; width: min(520px, calc(100vw - 2 * var(--stack-space-4))); max-height: calc(100vh - 2 * var(--stack-space-4));
  padding: 0; overflow: auto; border: var(--stack-border-width-thin) solid var(--stack-color-border-default); border-radius: var(--stack-radius-lg);

/* ---- Evidence (PR5) ---------------------------------------------------- */
.stack-evidence {
  margin: 0 0 var(--stack-space-4); padding: var(--stack-space-4);
  border: var(--stack-border-width-thin) solid var(--stack-color-border-default); border-radius: var(--stack-radius-lg);

/* ---- Notices, choices and history (0.6.0) ------------------------------ */

/* ---- Brand and marketing foundation (0.6.0, docs/brand.md) -------------- */

  background: var(--stack-color-bg-surface); color: var(--stack-color-text-default); font: inherit; font-size: var(--stack-text-sm-size);
}

/* Page layout primitives for websites. Patterns, not templates: a site uses
   the ones that fit its story. */
.stack-site-container { box-sizing: border-box; width: 100%; max-width: var(--stack-size-content-max); margin: 0 auto; padding: 0 clamp(var(--stack-space-4), 4vw, var(--stack-space-10)); }

.stack-eyebrow {
  margin: 0 0 var(--stack-space-3); color: var(--stack-product-accent); font-size: var(--stack-text-sm-size);
  font-weight: var(--stack-font-weight-semibold); letter-spacing: 0.06em; text-transform: uppercase;
}
.stack-display {
  margin: 0; color: var(--stack-color-text-default); font-size: var(--stack-text-display-size); line-height: var(--stack-text-display-line);
  font-weight: var(--stack-font-weight-bold); letter-spacing: var(--stack-letter-spacing-tight); text-wrap: balance;
}
.stack-heading {
  margin: 0 0 var(--stack-space-4); color: var(--stack-color-text-default); font-size: var(--stack-text-3xl-size); line-height: var(--stack-text-3xl-line);
  font-weight: var(--stack-font-weight-bold); letter-spacing: var(--stack-letter-spacing-tight); text-wrap: balance;
}
.stack-lede { max-width: var(--stack-size-prose-max); margin: var(--stack-space-5) 0 0; color: var(--stack-color-text-muted); font-size: var(--stack-text-xl-size); line-height: var(--stack-text-xl-line); }
.stack-hero { padding: clamp(var(--stack-space-12), 10vw, var(--stack-space-24)) 0 clamp(var(--stack-space-10), 8vw, var(--stack-space-20)); }
.stack-hero__actions { display: flex; flex-wrap: wrap; gap: var(--stack-space-3); margin-top: var(--stack-space-8); }
.stack-feature-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: var(--stack-space-4); margin: 0; padding: 0; list-style: none; }
.stack-feature {
  padding: var(--stack-space-6); border: var(--stack-border-width-thin) solid var(--stack-color-border-default);
  border-radius: var(--stack-radius-lg); background: var(--stack-color-bg-surface);
}

.stack-site-header {
  position: sticky; top: 0; z-index: var(--stack-z-sticky);
  border-bottom: var(--stack-border-width-thin) solid var(--stack-color-border-default);
  background: color-mix(in srgb, var(--stack-color-bg-canvas) 92%, transparent);

}

  border-radius: var(--stack-radius-md); background: var(--stack-color-text-default); color: var(--stack-color-text-inverse);
}

  box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; gap: var(--stack-space-2) var(--stack-space-6);
  max-width: var(--stack-size-content-max); min-height: 64px; margin: 0 auto; padding: var(--stack-space-2) clamp(var(--stack-space-4), 4vw, var(--stack-space-10));
}
.stack-site-header__identity { display: flex; align-items: center; gap: var(--stack-space-3); min-width: 0; flex-wrap: wrap; }
.stack-site-header__home {
  display: inline-flex; align-items: center; gap: var(--stack-space-2); align-self: center;
  color: var(--stack-color-text-default); text-decoration: none; font-size: var(--stack-text-lg-size);
  font-weight: var(--stack-font-weight-bold); letter-spacing: -0.01em;
}
.stack-site-header__logo { display: inline-flex; width: 24px; }

  display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: var(--stack-radius-md);
  background: var(--stack-product-accent); color: var(--stack-product-accent-fg); font-size: var(--stack-text-xs-size); letter-spacing: 0.02em;
}
.stack-site-header__family { color: var(--stack-color-text-muted); font-size: var(--stack-text-xs-size); text-decoration: none; white-space: nowrap; }
.stack-site-header__family:hover { color: var(--stack-color-text-default); text-decoration: underline; }
.stack-site-header .stack-site-header__nav { margin-left: auto; min-width: 0; }
.stack-site-header__nav-list { display: flex; gap: var(--stack-space-1); margin: 0; padding: 0; list-style: none; }
.stack-site-header .stack-site-header__nav-item {
  display: block; padding: var(--stack-space-2) var(--stack-space-3); border-radius: var(--stack-radius-md);
  color: var(--stack-color-text-muted); text-decoration: none; font-size: var(--stack-text-md-size); white-space: nowrap;
}
.stack-site-header__nav-item:hover { color: var(--stack-color-text-default); background: var(--stack-color-bg-sunken); }
.stack-site-header__nav-item[aria-current="page"] { color: var(--stack-color-text-default); box-shadow: inset 0 -2px 0 var(--stack-product-accent); border-radius: 0; }

@media (max-width: 860px) {

  .stack-site-header__end { margin-left: auto; }

  .stack-site-header__nav-list { padding: 0 clamp(var(--stack-space-4), 4vw, var(--stack-space-10)) var(--stack-space-1); }
  .stack-site-header .stack-site-header__nav-item { padding: var(--stack-space-2); }
}

/* Shared site chrome sits inside product pages whose stylesheets may style
   bare elements (nav, footer, a, p). The header and footer set every layout
   and text property they depend on, so a product's element rules cannot
   reshape them. */
.stack-site-header, .stack-site-footer { display: block; height: auto; padding: 0; margin: 0; text-align: left; text-transform: none; letter-spacing: normal; }
.stack-site-header nav, .stack-site-footer nav { display: block; gap: normal; padding: 0; margin: 0; border: 0; background: none; position: static; width: auto; height: auto; }
.stack-site-header a, .stack-site-footer a { text-transform: none; letter-spacing: normal; border: 0; font-weight: inherit; }
.stack-site-footer p, .stack-site-footer ul, .stack-site-footer li { text-align: left; }
.stack-site-footer__link, .stack-site-footer__company, .stack-site-footer__legal a { padding: 0; }
.stack-site-footer {
  border-top: var(--stack-border-width-thin) solid var(--stack-color-border-default); background: var(--stack-color-bg-sunken);
  color: var(--stack-color-text-muted); font-family: var(--stack-font-family-sans); font-size: var(--stack-text-md-size); line-height: var(--stack-text-md-line);
}
.stack-site-footer__inner { box-sizing: border-box; max-width: var(--stack-size-content-max); margin: 0 auto; padding: var(--stack-space-12) clamp(var(--stack-space-4), 4vw, var(--stack-space-10)) var(--stack-space-8); }
.stack-site-footer__top { display: grid; grid-template-columns: minmax(0, 2fr) repeat(auto-fit, minmax(140px, 1fr)); gap: var(--stack-space-8); }
.stack-site-footer__name { margin: 0; color: var(--stack-color-text-default); font-size: var(--stack-text-lg-size); font-weight: var(--stack-font-weight-bold); }
.stack-site-footer__tagline { margin: var(--stack-space-2) 0 0; max-width: 36ch; }
.stack-site-footer__heading { margin: 0 0 var(--stack-space-3); color: var(--stack-color-text-default); font-size: var(--stack-text-sm-size); font-weight: var(--stack-font-weight-semibold); }
.stack-site-footer__list, .stack-site-footer__products { margin: 0; padding: 0; list-style: none; min-width: 0; }
.stack-site-footer__column { min-width: 0; }
.stack-site-footer__list li + li { margin-top: var(--stack-space-2); }
.stack-site-footer a { color: inherit; text-underline-offset: 3px; }
.stack-site-footer__link { text-decoration: none; overflow-wrap: anywhere; }
.stack-site-footer__link:hover { color: var(--stack-color-text-default); text-decoration: underline; }
.stack-site-footer .stack-site-footer__family { margin-top: var(--stack-space-10); padding-top: var(--stack-space-6); border-top: var(--stack-border-width-thin) solid var(--stack-color-border-default); }
.stack-site-footer__company { display: inline-flex; align-items: center; gap: var(--stack-space-2); color: var(--stack-color-text-default) !important; font-weight: var(--stack-font-weight-semibold); text-decoration: none; }
.stack-site-footer__company:hover { text-decoration: underline; }
.stack-site-footer__mark { width: 20px; }
.stack-site-footer__products { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 150px), 1fr)); gap: var(--stack-space-2) var(--stack-space-4); margin-top: var(--stack-space-4); }
.stack-site-footer .stack-site-footer__product {
  display: flex; flex-direction: column; padding: var(--stack-space-2) 0 var(--stack-space-2) var(--stack-space-3);
  align-items: flex-start; gap: 0; white-space: normal;
  border: 0; border-left: var(--stack-border-width-thick) solid var(--stack-product-accent); text-decoration: none;
}
.stack-site-footer__product-name { color: var(--stack-color-text-default); font-weight: var(--stack-font-weight-semibold); }
.stack-site-footer__product-category { font-size: var(--stack-text-sm-size); }
.stack-site-footer__product[aria-current="true"] .stack-site-footer__product-name::after { content: " · this site"; font-weight: var(--stack-font-weight-regular); color: var(--stack-color-text-muted); }
.stack-site-footer__product:hover .stack-site-footer__product-name { text-decoration: underline; }
.stack-site-footer__legal { margin: var(--stack-space-8) 0 0; font-size: var(--stack-text-sm-size); }
@media (max-width: 640px) {
  .stack-site-footer__top { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .stack-site-footer__about { grid-column: 1 / -1; }
}
.stack-site-header a:focus-visible, .stack-site-footer a:focus-visible, .stack-theme-switch__control:focus-visible {
  outline: var(--stack-focus-ring-width) solid var(--stack-focus-ring-color);
  outline-offset: var(--stack-focus-ring-offset);
}

/* `hidden` hides a component even where its own rule sets `display`. Scoped to
   stack-* classes: core.css styles no element it does not own. */
[class^="stack-"][hidden], [class*=" stack-"][hidden] { display: none !important; }

/* Charts (docs/charts.md). Every colour is a token: series use the data
   palette (--stack-color-chart-N), everything else the text and border tokens.
   Tooltips show on hover and on keyboard focus; the data table is the
   complete alternative. */
.stack-chart {
  margin: 0; min-width: 0; display: flex; flex-direction: column; gap: var(--stack-space-2);
  color: var(--stack-color-text-default); font-family: var(--stack-font-family-sans);
}
.stack-chart__header { display: flex; flex-direction: column; gap: 2px; }
.stack-chart__title { margin: 0; font-size: var(--stack-text-md-size); line-height: var(--stack-text-md-line); font-weight: var(--stack-font-weight-semibold); }
.stack-chart__description { color: var(--stack-color-text-muted); font-size: var(--stack-text-sm-size); line-height: var(--stack-text-sm-line); }
.stack-chart__plot { min-width: 0; width: 100%; }
.stack-chart__svg, .stack-sparkline__svg { display: block; overflow: visible; }
.stack-chart__svg { width: 100%; height: auto; max-width: 100%; }
.stack-chart__state { min-height: 120px; display: flex; align-items: center; }
.stack-chart__state > * { flex: 1; }

/* Series colour: one custom property per palette slot. */
.stack-chart__s1 { --stack-chart-c: var(--stack-color-chart-1); }
.stack-chart__s2 { --stack-chart-c: var(--stack-color-chart-2); }
.stack-chart__s3 { --stack-chart-c: var(--stack-color-chart-3); }
.stack-chart__s4 { --stack-chart-c: var(--stack-color-chart-4); }
.stack-chart__s5 { --stack-chart-c: var(--stack-color-chart-5); }
.stack-chart__s6 { --stack-chart-c: var(--stack-color-chart-6); }
.stack-chart__s7 { --stack-chart-c: var(--stack-color-chart-7); }
.stack-chart__s8 { --stack-chart-c: var(--stack-color-chart-8); }

.stack-chart__tick, .stack-chart__axis-label { fill: var(--stack-color-text-muted); font-size: var(--stack-text-xs-size); font-family: var(--stack-font-family-sans); }
.stack-chart__axis-label { fill: var(--stack-color-text-subtle); }
.stack-chart__tick--start { text-anchor: start; }
.stack-chart__tick--middle { text-anchor: middle; }
.stack-chart__tick--end { text-anchor: end; }
.stack-chart__grid { stroke: var(--stack-color-border-subtle); stroke-width: 1; }
.stack-chart__zero { stroke: var(--stack-color-border-strong); }

.stack-chart__line { fill: none; stroke: var(--stack-chart-c); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
/* Line series also differ by dash pattern, never only by colour. */
.stack-chart--line .stack-chart__d1 .stack-chart__line { stroke-dasharray: 7 4; }
.stack-chart--line .stack-chart__d2 .stack-chart__line { stroke-dasharray: 2 3; }
.stack-chart--line .stack-chart__d3 .stack-chart__line { stroke-dasharray: 10 3 2 3; }
.stack-chart__area { fill: var(--stack-chart-c); fill-opacity: 0.18; stroke: none; }
.stack-chart__point { fill: var(--stack-color-bg-surface); stroke: var(--stack-chart-c); stroke-width: 2; }
.stack-chart__bar { fill: var(--stack-chart-c); }
.stack-chart--bar .stack-chart__bar { stroke: var(--stack-color-bg-surface); stroke-width: 0.5; }
.stack-chart__arc { fill: var(--stack-chart-c); stroke: var(--stack-color-bg-surface); stroke-width: 2; }
.stack-chart__center-value { fill: var(--stack-color-text-default); font-size: var(--stack-text-lg-size); font-weight: var(--stack-font-weight-semibold); }
.stack-chart__center-label { fill: var(--stack-color-text-muted); font-size: var(--stack-text-xs-size); }

/* Focus and hover targets. */
.stack-chart__target, .stack-chart__slice { outline: none; }
.stack-chart__target-area { fill: transparent; }
.stack-chart__cursor { stroke: var(--stack-color-border-strong); stroke-width: 1; visibility: hidden; pointer-events: none; }
.stack-chart__target:hover .stack-chart__target-area, .stack-chart__target:focus-visible .stack-chart__target-area { fill: var(--stack-color-border-strong); fill-opacity: 0.1; }
.stack-chart__target:focus-visible .stack-chart__target-area { stroke: var(--stack-focus-ring-color); stroke-width: var(--stack-focus-ring-width); }
.stack-chart__slice:focus-visible .stack-chart__arc { stroke: var(--stack-focus-ring-color); stroke-width: 3; }
.stack-chart__slice:hover .stack-chart__arc { fill-opacity: 0.85; }
.stack-chart__targets { pointer-events: all; }
.stack-chart__marks { pointer-events: none; }
.stack-chart--donut .stack-chart__marks { pointer-events: all; }
.stack-chart__tip { visibility: hidden; pointer-events: none; }
.stack-chart__target:hover .stack-chart__tip, .stack-chart__target:focus .stack-chart__tip,
.stack-chart__target:hover .stack-chart__cursor, .stack-chart__target:focus .stack-chart__cursor,
.stack-chart__slice:hover .stack-chart__tip, .stack-chart__slice:focus .stack-chart__tip { visibility: visible; }
.stack-chart__tip-box { fill: var(--stack-color-bg-raised); stroke: var(--stack-color-border-default); filter: drop-shadow(var(--stack-shadow-raised)); }
.stack-chart__tip-title { fill: var(--stack-color-text-default); font-size: var(--stack-text-xs-size); font-weight: var(--stack-font-weight-semibold); }
.stack-chart__tip-row { fill: var(--stack-color-text-default); font-size: var(--stack-text-xs-size); }
.stack-chart__tip-swatch { fill: var(--stack-chart-c); }

/* Legend: text labels, wrapping; toggles when the product lets series hide. */
.stack-chart__legend { display: flex; flex-wrap: wrap; gap: var(--stack-space-1) var(--stack-space-4); margin: 0; padding: 0; list-style: none; font-size: var(--stack-text-sm-size); line-height: var(--stack-text-sm-line); }
.stack-chart__legend-item, .stack-chart__legend-toggle { display: inline-flex; align-items: center; gap: var(--stack-space-2); min-width: 0; }
.stack-chart__legend-label { overflow-wrap: anywhere; }
.stack-chart__legend-note { color: var(--stack-color-text-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.stack-chart__legend-toggle {
  font: inherit; color: inherit; background: none; border: var(--stack-border-width-thin) solid transparent;
  border-radius: var(--stack-radius-sm); padding: 2px var(--stack-space-1); min-height: 24px; cursor: pointer;
}
.stack-chart__legend-toggle:hover { border-color: var(--stack-color-border-default); }
.stack-chart__legend-toggle:focus-visible { outline: var(--stack-focus-ring-width) solid var(--stack-focus-ring-color); outline-offset: var(--stack-focus-ring-offset); }
.stack-chart__legend-item--hidden .stack-chart__legend-label { text-decoration: line-through; color: var(--stack-color-text-muted); }
.stack-chart__legend-item--hidden .stack-chart__swatch { opacity: 0.35; }
.stack-chart__swatch { flex: none; width: 12px; height: 12px; border-radius: 2px; background: var(--stack-chart-c); }
.stack-chart__swatch--line { height: 0; width: 18px; border-radius: 0; background: none; border-top: 3px solid var(--stack-chart-c); }
.stack-chart__swatch--line.stack-chart__d1 { border-top-style: dashed; }
.stack-chart__swatch--line.stack-chart__d2 { border-top-style: dotted; }
.stack-chart__swatch--line.stack-chart__d3 { border-top-style: double; }

/* Donut: plot and legend side by side when there is room. */
.stack-chart__donut { display: flex; flex-wrap: wrap; align-items: center; gap: var(--stack-space-4); }
.stack-chart__plot--donut { flex: 0 1 240px; max-width: 280px; }
.stack-chart__donut .stack-chart__legend { flex: 1 1 200px; flex-direction: column; flex-wrap: nowrap; }

/* The data table alternative. */
.stack-chart__data { font-size: var(--stack-text-sm-size); }
.stack-chart__data-summary { cursor: pointer; color: var(--stack-color-text-link); width: fit-content; border-radius: var(--stack-radius-sm); }
.stack-chart__data-summary:focus-visible { outline: var(--stack-focus-ring-width) solid var(--stack-focus-ring-color); outline-offset: var(--stack-focus-ring-offset); }
.stack-chart__table-wrap { overflow-x: auto; margin-top: var(--stack-space-2); }
.stack-chart__table { border-collapse: collapse; min-width: 100%; }
.stack-chart__table th, .stack-chart__table td { padding: var(--stack-space-1) var(--stack-space-2); border-bottom: var(--stack-border-width-thin) solid var(--stack-color-border-subtle); text-align: left; font-weight: var(--stack-font-weight-regular); white-space: nowrap; }
.stack-chart__table thead th { color: var(--stack-color-text-muted); font-weight: var(--stack-font-weight-semibold); }
.stack-chart__table .stack-chart__num { text-align: right; font-variant-numeric: tabular-nums; }
.stack-chart__table [data-missing] { color: var(--stack-color-text-muted); }

/* Sparkline: inline, no axes. */
.stack-sparkline { display: inline-flex; vertical-align: middle; color: var(--stack-color-chart-1); }
.stack-sparkline__line { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
.stack-sparkline__point, .stack-sparkline__endpoint { fill: currentColor; }
.stack-sparkline__empty { color: var(--stack-color-text-muted); }
</style>
<style>/* Showcase page layout only. Every component style comes from stack-ui. */
body { margin: 0; background: var(--stack-color-bg-canvas); color: var(--stack-color-text-default); font-family: var(--stack-font-family-sans); font-size: var(--stack-text-md-size); line-height: var(--stack-text-md-line); }
.showcase { max-width: var(--stack-size-content-max); margin: 0 auto; padding: var(--stack-space-6) var(--stack-space-4) var(--stack-space-16); display: flex; flex-direction: column; gap: var(--stack-space-4); }
.showcase-h2 { margin: var(--stack-space-6) 0 0; font-size: var(--stack-text-lg-size); }
.showcase-lead { margin: 0; color: var(--stack-color-text-muted); }
.showcase-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: var(--stack-space-4); }
.showcase-card { min-width: 0; background: var(--stack-color-bg-surface); border: var(--stack-border-width-thin) solid var(--stack-color-border-default); border-radius: var(--stack-radius-lg); padding: var(--stack-space-4); }
.showcase-note { margin: var(--stack-space-3) 0 0; color: var(--stack-color-text-subtle); font-size: var(--stack-text-xs-size); line-height: var(--stack-text-xs-line); }
.showcase-narrow { display: flex; flex-wrap: wrap; gap: var(--stack-space-4); }
.showcase-narrow > .showcase-card { flex: 0 1 300px; }
.showcase-table { width: 100%; border-collapse: collapse; }
.showcase-table th, .showcase-table td { text-align: left; padding: var(--stack-space-2) var(--stack-space-1); border-bottom: var(--stack-border-width-thin) solid var(--stack-color-border-subtle); font-weight: var(--stack-font-weight-regular); }
.showcase-table thead th { color: var(--stack-color-text-muted); font-weight: var(--stack-font-weight-semibold); }
.showcase-num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
</style>
